# Production stack — postgres + backend + frontend + watchtower (auto-deploy)
# ใช้กับ managed DB จริงได้โดยลบ service postgres แล้วชี้ DATABASE_URL ไป cloud
#
# 🔄 Auto-deploy: merge main → GitHub Actions build+push image → GHCR
#    → watchtower บน server ดึง image ใหม่มาเปลี่ยน container เอง (ไม่ต้อง SSH)
#    image มาจาก GHCR — ตั้ง IMAGE_PREFIX ใน .env ได้ (default = repo นี้)
#    ครั้งแรกต้อง `docker login ghcr.io` บน server ก่อน (image เป็น private) → ดู docs/CICD.md
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ต้องตั้ง POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pmo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: ${IMAGE_PREFIX:-ghcr.io/thanapholelegance502/dashboard_pm}-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ./server/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    # publish 3000 เฉพาะ localhost ของ host — สำหรับ authorize (SSH tunnel) + debug
    # ไม่เปิดออก network (ปลอดภัย) · web container คุยผ่าน network ภายในอยู่แล้ว
    ports:
      - "127.0.0.1:3000:3000"
    # migrate deploy รันอัตโนมัติตอน start อยู่แล้ว (ดู server/Dockerfile)
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/thanapholelegance502/dashboard_pm}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - server
    # ไม่ publish host port — ให้ ingress (caddy/cloudflared) รับจากภายนอกแล้วต่อ web:80 ใน network
    # (ปลอดภัยกว่า + กัน port ชนบน host) · เลือก ingress ด้วย COMPOSE_PROFILES=caddy หรือ tunnel
    expose:
      - "80"
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # 🔒 Caddy ingress (POC) — HTTPS ฟรีจาก Let's Encrypt + DuckDNS · เปิด port 80/443
  # เปิดใช้:  COMPOSE_PROFILES=caddy  (ใน .env) — หรือ  --profile caddy
  # ต้องตั้ง PUBLIC_DOMAIN + ACME_EMAIL ใน .env + Caddyfile (root) — ดู docs/POC-DEPLOY.md
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["caddy"]
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # เก็บ cert ข้าม restart (สำคัญ — กันโดน rate limit)
      - caddy_config:/config

  # 🌐 Cloudflare Tunnel — ทางเข้าจากอินเทอร์เน็ต (HTTPS ฟรี) โดย "ไม่ต้องเปิด port เข้า"
  # server ยิง outbound ไปหา Cloudflare เอง → แก้ปัญหา provider ไม่เปิด port หมดจด
  # เปิดใช้ด้วย profile:  docker compose -f docker-compose.prod.yml --profile tunnel up -d
  # ต้องตั้ง CLOUDFLARE_TUNNEL_TOKEN ใน .env + ชี้ public hostname → http://web:80 (ดู docs/CLOUDFLARE-TUNNEL.md)
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel run
    environment:
      # ต้องตั้งใน .env ก่อนใช้ profile tunnel (ว่าง = cloudflared จะ error ตอน start) — ดู docs/CLOUDFLARE-TUNNEL.md
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web

  # 🧪 บอร์ด QA — แอปจาก repo Dashboard_Tester (ทีม tester ดูแลเอง) · ดู docs/BOARD-INTEGRATION.md
  # nginx (web) เช็กสิทธิ์บอร์ด QA ก่อนส่งต่อที่ /qa/ → ห้ามเปิด port ออก host (ต้องผ่าน nginx เท่านั้น)
  # เปิดใช้: COMPOSE_PROFILES=caddy,qa (ใน .env) · ตั้งค่าแอปที่ ./qa.env (ดู qa.env.example)
  qa:
    image: ${QA_IMAGE:-ghcr.io/thanapholelegance502/dashboard_tester:latest}
    restart: unless-stopped
    profiles: ["qa"]
    env_file: ./qa.env
    expose:
      - "5173"
    volumes:
      - qa_config:/app/config   # Lark token / ตั้งค่าของแอป QA — รอดตอน rebuild
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # 📋 บอร์ด BA — แอปจาก repo Dashboard_BA (ทีม BA ดูแลเอง) · ดู docs/BA-ONBOARDING.md
  # เปิดใช้: COMPOSE_PROFILES=caddy,qa,ba · ตั้งค่าแอปที่ ./ba.env (ดู ba.env.example) · DB = database `ba` (scripts/create-board-db.sh ba)
  ba:
    image: ${BA_IMAGE:-ghcr.io/thanapholelegance502/dashboard_ba:latest}
    restart: unless-stopped
    profiles: ["ba"]
    env_file: ./ba.env
    depends_on:
      - postgres
    expose:
      - "8080"
    volumes:
      - ba_config:/app/config   # ไฟล์ import / ตั้งค่าของแอป BA — รอดตอน deploy
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # 🔄 auto-deploy agent — poll GHCR แล้วเปลี่ยน container ที่ติด label ข้างบนเท่านั้น
  # (postgres ไม่ติด label → ไม่ยุ่ง · watchtower ไม่ update ตัวเอง)
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # creds สำหรับดึง image private จาก GHCR (สร้างด้วย `docker login ghcr.io` บน server)
      # mount ทั้งโฟลเดอร์ (ไม่ใช่ไฟล์) — ถ้า up ก่อน login, docker จะสร้าง config.json เป็นโฟลเดอร์เปล่า
      # แล้ว `docker login` เขียนทับไม่ได้ ("config.json: is a directory") · โฟลเดอร์ไม่มีปัญหานี้
      - ${DOCKER_CONFIG_DIR:-/root/.docker}:/config:ro
    environment:
      DOCKER_CONFIG: /config                   # ให้ watchtower อ่าน /config/config.json
      # containrrr/watchtower (เลิกพัฒนาแล้ว) คุยด้วย API 1.25 → Docker Engine ใหม่ปฏิเสธ
      # ("client version 1.25 is too old. Minimum supported API version is 1.44") → บังคับ API ใหม่
      DOCKER_API_VERSION: ${WATCHTOWER_DOCKER_API_VERSION:-1.44}
      WATCHTOWER_LABEL_ENABLE: "true"          # update เฉพาะ container ที่ enable
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-120} # เช็คทุก 120 วินาที
      WATCHTOWER_CLEANUP: "true"               # ลบ image เก่าหลัง update (กันดิสก์เต็ม)
      WATCHTOWER_ROLLING_RESTART: "true"       # เปลี่ยนทีละ container
      TZ: ${TZ:-Asia/Bangkok}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  qa_config:
  ba_config:
