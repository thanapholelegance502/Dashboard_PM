# CI + Deploy — merge เข้า main → test → build image → push GHCR
# server ดึง image ใหม่เอง (Watchtower) ไม่ต้อง SSH เข้า server
# (pull-based: ใช้ได้แม้ provider ยังไม่เปิด port เข้า inbound)
name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# กัน deploy ซ้อนกันเวลา merge ติดๆ กัน — คิวทีละอัน ไม่ยกเลิกของเดิม
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── ด่านกั้น: unit tests (ยกเว้น pm-api ที่ต้องมี DB sync จริง) ──
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:ci

  # ── build + push 2 images (server + web) → GHCR — เฉพาะตอน merge main ──
  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: server
            context: ./server
          - image: web
            context: ./web
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # image name → ghcr.io/<owner>/<repo>-<server|web> (metadata-action lowercase ให้เอง)
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
