# serve React static + proxy /api → backend + บอร์ดแผนก (/qa/…) หลังเช็กสิทธิ์
# HTTPS ทำที่ ingress ชั้นนอก (Caddy/Cloudflare) แล้ว proxy เข้ามาเป็น http ภายใน
# nginx ตัวนี้อยู่ทั้งโหมด POC (caddy) และ staging (tunnel) → routing/สิทธิ์บอร์ดจึงอยู่ที่นี่ ไม่ใช่ที่ ingress
#
# ‼️ X-Forwarded-Proto: ต้องส่งต่อค่าจริงจาก ingress (https) ไม่ใช่ $scheme (=http ภายใน)
#    ไม่งั้น backend เห็นเป็น http → ปฏิเสธ set secure cookie → session ไม่ติด (login loop)
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;  # ผ่าน ingress → ใช้ค่าที่ ingress ส่งมา (https)
  ''      $scheme;                  # เข้าตรง (ไม่มี ingress) → ใช้ scheme ของ nginx เอง
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # DNS ภายใน docker — ให้ proxy_pass แบบตัวแปร resolve ตอนมี request
  # (container บอร์ดแผนกยังไม่ขึ้น nginx ก็ยัง boot ได้ แค่ตอบ 502 เฉพาะ path นั้น)
  resolver 127.0.0.11 valid=10s ipv6=off;

  # SPA — ทุก route ที่ไม่ใช่ไฟล์จริง → index.html
  location / {
    try_files $uri /index.html;
  }

  # API → backend container
  location /api/ {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  # ── บอร์ดแผนก (แอปจาก repo ของทีมแผนก) — ดู docs/BOARD-INTEGRATION.md ──
  # ทุก request ใต้ /qa/ ต้องผ่าน /api/auth/check?board=QA ก่อน (session cookie เดียวกับ portal)
  # 401 → กลับหน้า login · 403 → กลับ landing + แจ้งไม่มีสิทธิ์ · ผ่าน → ส่งตัวตนต่อให้แอปทาง header
  location = /_auth/qa {
    internal;
    proxy_pass http://server:3000/api/auth/check?board=QA;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  location = /qa {
    return 301 /qa/;
  }

  location /qa/ {
    auth_request /_auth/qa;
    auth_request_set $portal_user $upstream_http_x_portal_user;
    auth_request_set $portal_role $upstream_http_x_portal_role;
    error_page 401 = @portal_login;
    error_page 403 = @portal_noboard;

    set $qa_upstream http://qa:5173;
    proxy_pass $qa_upstream;   # ตัวแปร + ไม่มี URI → ส่ง path เต็ม (/qa/...) แอปตัด BASE_PATH เอง
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    # ทับค่าที่ client อาจปลอมส่งมาเสมอ — แอปแผนกเชื่อ header นี้ได้เพราะเข้าถึงได้ทาง nginx เท่านั้น
    proxy_set_header X-Portal-User $portal_user;
    proxy_set_header X-Portal-Role $portal_role;
  }

  # บอร์ด BA (repo Dashboard_BA) — แบบเดียวกับ /qa/ · ดู docs/BA-ONBOARDING.md
  location = /_auth/ba {
    internal;
    proxy_pass http://server:3000/api/auth/check?board=BA;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  location = /ba {
    return 301 /ba/;
  }

  location /ba/ {
    auth_request /_auth/ba;
    auth_request_set $portal_user $upstream_http_x_portal_user;
    auth_request_set $portal_role $upstream_http_x_portal_role;
    error_page 401 = @portal_login;
    error_page 403 = @portal_noboard;

    set $ba_upstream http://ba:8080;
    proxy_pass $ba_upstream;   # ส่ง path เต็ม (/ba/...) แอปตัด BASE_PATH เอง
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Portal-User $portal_user;
    proxy_set_header X-Portal-Role $portal_role;
  }

  location @portal_login {
    return 302 /;
  }

  location @portal_noboard {
    return 302 /?auth=noboard;
  }
}
