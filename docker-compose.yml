# Postgres 16 สำหรับ local dev (MASTER §3)
services:
  postgres:
    image: postgres:16-alpine
    container_name: pmo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pmo
    ports:
      - "5432:5432"
    volumes:
      - pmo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pmo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pmo_pgdata:
